<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product | I MART</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/edit-product.css">

</head>

<body>

<header class="header">

    <div class="logo">

        <a href="index.html">

            <img src="images/logo.png" alt="I MART">

        </a>

    </div>

    <nav>

        <a href="seller-dashboard.html">Dashboard</a>
        <a href="seller-products.html">My Products</a>

    </nav>

</header>

<section class="edit-product">

    <div class="form-box">

        <h1>Edit Product</h1>

        <form id="editProductForm">

            <div class="form-group">

                <label>Product Name</label>

                <input
                    type="text"
                    id="name"
                    required>

            </div>

            <div class="form-group">

                <label>Description</label>

                <textarea
                    id="description"
                    rows="5"
                    required></textarea>

            </div>

            <div class="form-group">

                <label>Category</label>

                <input
                    type="text"
                    id="category"
                    required>

            </div>

            <div class="form-group">

                <label>Price</label>

                <input
                    type="number"
                    id="price"
                    required>

            </div>

            <div class="form-group">

                <label>Stock</label>

                <input
                    type="number"
                    id="stock"
                    required>

            </div>

            <div class="form-group">

                <label>Image URL</label>

                <input
                    type="text"
                    id="image">

            </div>

            <button class="btn" type="submit">

                💾 Save Changes

            </button>

        </form>

    </div>

</section>

<script src="js/edit-product.js"></script>

</body>

</html>

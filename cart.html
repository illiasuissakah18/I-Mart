<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | I MART</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/cart.css">

</head>

<body>

<header class="header">

    <h1>🛒 Shopping Cart</h1>

</header>

<main class="cart-container">

    <div id="cartItems">

        <p>Your cart is loading...</p>

    </div>

    <div class="cart-summary">

        <h2>Order Summary</h2>

        <h3>Total: <span id="cartTotal">GH₵0.00</span></h3>

        <button id="checkoutBtn" class="btn">

            Proceed to Checkout

        </button>

    </div>

</main>

<script src="js/cart.js"></script>

</body>

</html>

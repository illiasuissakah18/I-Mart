<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I MART Seller Orders</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/seller.css">
</head>
<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">
        <a href="seller-dashboard.html">
            <img src="images/logo.png" alt="I MART Logo">
        </a>
    </div>

    <nav>
        <a href="seller-dashboard.html">Dashboard</a>
        <a href="seller-products.html">Products</a>
        <a href="seller-orders.html" class="active">Orders</a>
        <a href="#" onclick="sellerLogout()">Logout</a>
    </nav>

</header>

<!-- ================= PAGE TITLE ================= -->

<section class="page-title">

    <h1>My Orders</h1>

    <p>
        Manage customer orders for your products.
    </p>

</section>

<!-- ================= SUMMARY ================= -->

<section class="orders-summary">

    <div class="dashboard-cards">

        <div class="dashboard-card">
            <h3>Total Orders</h3>
            <h2 id="totalOrders">0</h2>
        </div>

        <div class="dashboard-card">
            <h3>Pending</h3>
            <h2 id="pendingOrders">0</h2>
        </div>

        <div class="dashboard-card">
            <h3>Processing</h3>
            <h2 id="processingOrders">0</h2>
        </div>

        <div class="dashboard-card">
            <h3>Delivered</h3>
            <h2 id="deliveredOrders">0</h2>
        </div>

    </div>

</section>

<!-- ================= ORDERS TABLE ================= -->

<section class="seller-orders">

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Order ID</th>

                    <th>Customer</th>

                    <th>Product</th>

                    <th>Quantity</th>

                    <th>Total</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="sellerOrdersTable">

            </tbody>

        </table>

    </div>

</section>

<script src="js/seller-auth.js"></script>

<script src="js/seller-orders.js"></script>

<script>

protectSellerDashboard();

</script>

</body>
</html>

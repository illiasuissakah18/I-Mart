<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Registration | I MART</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<header class="header">

    <div class="logo">

        <a href="index.html">

            <img src="images/logo.png" alt="I MART Logo">

        </a>

    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="products.html">Products</a>

        <a href="customer-login.html">Login</a>

    </nav>

</header>

<section class="auth-section">

    <div class="auth-card">

        <h1>Create Customer Account</h1>

        <p>
            Join I MART and start shopping from trusted sellers.
        </p>

        <form id="customerRegisterForm">

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

            </div>

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

            </div>

            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>

            <button type="submit" class="btn">

                Create Account

            </button>

        </form>

        <div class="auth-footer">

            Already have an account?

            <a href="customer-login.html">

                Login Here

            </a>

        </div>

    </div>

</section>

<script src="js/customer-auth.js"></script>

</body>

</html>

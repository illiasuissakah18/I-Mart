<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I MART Seller Login</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/seller.css">

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">

        <a href="index.html">

            <img src="images/logo.png" alt="I MART Logo">

        </a>

    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="products.html">Marketplace</a>

        <a href="seller-register.html">Become a Seller</a>

    </nav>

</header>

<!-- ================= LOGIN SECTION ================= -->

<section class="seller-login-section">

    <div class="seller-login-card">

        <h1>Seller Login</h1>

        <p>

            Login to manage your store, products and orders.

        </p>

        <form id="sellerLoginForm">

            <input
                type="email"
                id="sellerEmail"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="sellerPassword"
                placeholder="Password"
                required
            >

            <div class="remember-row">

                <label>

                    <input
                        type="checkbox"
                        id="rememberSeller"
                    >

                    Remember Me

                </label>

                <a href="#">

                    Forgot Password?

                </a>

            </div>

            <button type="submit">

                Login

            </button>

        </form>

        <div class="seller-links">

            <p>

                Don't have a seller account?

                <a href="seller-register.html">

                    Register Here

                </a>

            </p>

        </div>

    </div>

</section>

<!-- ================= FOOTER ================= -->

<footer class="footer">

    <p>

        © 2026 I MART Marketplace. All Rights Reserved.

    </p>

</footer>

<!-- ================= JAVASCRIPT ================= -->

<script src="js/seller-auth.js"></script>

</body>

</html>

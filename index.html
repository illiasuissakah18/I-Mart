<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I MART - Fashion Marketplace</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="header">

    <div class="logo">
        <a href="index.html">
            <img src="images/logo.png" alt="I MART Logo">
        </a>
    </div>

    <div class="search-bar">
        <input type="text" placeholder="Search products...">
        <button><i class="fas fa-search"></i></button>
    </div>

    <div class="header-icons">

        <a href="wishlist.html">
            ❤️ Wishlist <span class="wishlist-count">0</span>
        </a>

        <a href="cart.html">
            🛒 Cart <span class="cart-count">0</span>
        </a>

        <a href="login.html">
            👤 Account
        </a>

    </div>

    <div id="user-area"></div>

</header>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>

</nav>

<!-- ================= HERO ================= -->
<section class="hero">

    <div class="hero-text">

        <h1>Welcome to I MART</h1>
        <p>Your Number One Fashion Marketplace</p>

        <a href="products.html" class="btn">Shop Now</a>

    </div>

    <div class="hero-image">
        <img src="images/hero.jpg" alt="Hero Image">
    </div>

</section>

<!-- ================= CATEGORIES ================= -->
<section class="categories">

    <h2>Shop by Category</h2>

    <div class="category-list">

        <a href="#">Men</a>
        <a href="#">Women</a>
        <a href="#">Shoes</a>
        <a href="#">Bags</a>
        <a href="#">Watches</a>
        <a href="#">Accessories</a>

    </div>

</section>

<!-- ================= FEATURED PRODUCTS ================= -->
<section class="products">

    <h2>Featured Products</h2>

    <div class="product-grid">
        <!-- Products will be loaded here dynamically -->
    </div>

</section>

<!-- ================= FOOTER ================= -->
<footer>

    <p>© 2026 I MART Fashion Marketplace. All rights reserved.</p>

</footer>

<!-- ================= SCRIPTS ================= -->
<script src="js/products-data.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/products.js"></script>
<script src="js/app.js"></script>

</body>
</html>
